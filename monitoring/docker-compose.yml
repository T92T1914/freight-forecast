# Local monitoring stack: the API, Prometheus scraping it, Grafana
# pre-provisioned with the dashboard. From the repo root:
#   docker compose -f monitoring/docker-compose.yml up --build
# Grafana: http://localhost:3000 (anonymous viewer enabled)
services:
  api:
    build: ..
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.9.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/freight-forecast.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
