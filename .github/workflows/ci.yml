name: CI

on:
  push:
  pull_request:

# nothing here writes to the repository, so the token gets read access only
permissions:
  contents: read

# a newer push to the same branch supersedes whatever is still running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: make install
      - run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      # one interpreter failing should not hide the others' results
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: make install
      - run: make test

  build-image:
    # the image trains the model during build, so a green build also means
    # the model still beats the seasonal naive (train.py exits 1 otherwise)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t freight-forecast:${{ github.sha }} .
