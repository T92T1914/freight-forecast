# Local-cluster deployment (k3d/minikube): 2 replicas behind a ClusterIP.
# The image trains its model at build time, so pods are stateless and
# interchangeable — no volumes, no init containers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freight-forecast
  labels:
    app: freight-forecast
spec:
  replicas: 2
  selector:
    matchLabels:
      app: freight-forecast
  template:
    metadata:
      labels:
        app: freight-forecast
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: freight-forecast:latest
          # local cluster: image is side-loaded (k3d image import), not pulled
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          # readiness gates traffic: a pod still loading the artifact
          # receives nothing. liveness restarts a wedged process.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
